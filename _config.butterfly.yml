# --------------------------------------
# Butterfly 主题配置（覆盖主题默认值）
# 完整说明：https://butterfly.js.org/
# --------------------------------------

# 导航栏
nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: false

# 菜单（名称: 路径 || 图标）
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  关于: /about/ || fas fa-heart

# 社交图标
social:
  fab fa-github: https://github.com/gumohua || Github || '#24292e'
  fas fa-envelope: mailto:example@example.com || Email || '#4a7dbe'

# 头像与图标
favicon: /img/favicon.ico
avatar:
  img: /img/butterfly-icon.png
  effect: false

# 侧边栏
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description:
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/gumohua
  card_announcement:
    enable: true
    content: 欢迎来到我的博客
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 40
    color: false
    orderby: random
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    sort_order:

# 首页
subtitle:
  enable: true
  effect: true
  source: false
  sub:
    - 记录与分享
    - Stay hungry, stay foolish.

index_layout: 3
index_post_content:
  method: 3
  length: 300

# 文章页
toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 代码块
code_blocks:
  theme: light
  macStyle: false
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

# 搜索（本地搜索，无需外部服务）
search:
  use: local_search
  placeholder: 搜索文章...
  local_search:
    preload: false
    top_n_per_article: 1
    unescape: false
    pagination:
      enable: false
      hitsPerPage: 8
    CDN:

# 分享
share:
  use: sharejs
  sharejs:
    sites: facebook,x,wechat,weibo,qq

# 评论：Giscus（GitHub Discussions）
comments:
  use: Utterances
  text: true
  lazyload: false
  count: false
  card_post_count: false

  utterances:
  repo: gumohua/blog
  issue_term: pathname

giscus:
  repo: gumohua/blog
  repo_id:
  category_id:
  light_theme: light
  dark_theme: dark
  js:
  option:

# 页脚
footer:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: true
    version: false
  custom_text:

# 深色模式
darkmode:
  enable: true
  button: true
  autoChangeMode: false

# 页面显示模式
display_mode: light
